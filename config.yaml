model_name: "microsoft/trocr-small-handwritten"
image_dir: "D:/completed"
annotation_file: "data/raw/annotations.csv.xlsx"
label_column: "text"
filename_column: "filename"

split:
  train: 0.80
  val: 0.10
  test: 0.10
  seed: 42

training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 0.00003
  weight_decay: 0.01
  epochs: 10
  warmup_ratio: 0.10
  gradient_accumulation_steps: 2
  max_target_length: 16
  num_workers: 2
  fp16: true
  seed: 42
  save_dir: "checkpoints"
