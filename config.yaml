# Project configuration: the ONE config file. Data locations, label rules, inference defaults and the training recipe all live here.
# Relative paths are resolved against the project root, so scripts work from any working directory.
# Command-line flags on individual scripts still override anything here for a single run.

# ---- Raw data (src/master/build_master.py, src/noise_classifier/prepare_dataset.py) ----------------------------------
image_dir: "D:/all_roi_images"               # folder with every labelled crop image
annotation_file: "D:/annotations.xlsx"           # workbook: one row per image; `text` = verbatim, `Normalize` = training label
label_column: "Normalize"
filename_column: "filename"
split:                                       # random per-crop split used by the noise-classifier dataset builder
  train: 0.80
  val: 0.10
  test: 0.10
  seed: 25
docsplit:                                    # document-level split (no document in two sets)
  seed: 42
  tries: 300

# ---- Folders ---------------------------------------------------------------------------------------------------------
paths:
  master_dataset: data/master_dataset.mdb    # THE dataset: every real + synthetic crop in one file (src/master/dataset_io.py)
  lmdb_dir: data/master_lmdb                 # PARSeq training layout, produced from master_dataset by `dataset_io.py unpack`
  noise_dataset_dir: data/noise_classifier   # noise/clean crop CSVs
  outputs_dir: outputs                       # training runs
  reports_dir: reports                       # result tables
  models_dir: models                         # exported deployment checkpoints
  mlflow_db: mlflow.db                       # MLflow tracking store (created on the first run)

# ---- Environment (drive short of space? null = OS default) -----------------------------------------------------------
env:
  tmp_dir: "D:/tmp"
  torch_home: "D:/cache/torch"

# ---- Label rules (inference flag + data cleaning) --------------------------------------------------------------------
labels:
  # "clean" label: a digit run with an optional subpart letter (6b), a Roman numeral, or a bare subpart letter, optionally wrapped in
  # parens and/or ending in '.' / ')' / '.)'. Anything else is flagged at inference time as "does not look like a valid label".
  clean_pattern: '^\(?(?:[0-9]+[a-jA-J]?|[IVXivx]+|[a-jA-J])(?:\.\)|[.)])?\)?\Z'
  ambiguous_markers: ["ambigous", "ambiguous"]
  excel_artifact_pattern: '_x000[0-9A-Fa-f]_'
  doc_id_pattern: '^(Doc\d+)'                # first group of the file name = document id

# ---- LMDB packing (src/parseq/prepare_parseq_dataset.py) -------------------------------------------------------------
lmdb:
  dataset_name: handwriting                  # folder under <lmdb>/<split>/ ; equals data.train_dir for training
  map_size_mb: 512

# ---- Inference and review --------------------------------------------------------------------------------------------
inference:
  checkpoint: models/parseq_master_v3/parseq_master_v3.ckpt   # the model kept as the best (see docs/MODEL_REPORT.md)
  flag_threshold: 0.5                        # a prediction whose minimum per-character probability is below this is "flagged for review"

# ---- Training recipe: PARSeq fine-tuning, exactly the parseq_master_v3 run (docs/MODEL_REPORT.md) -------------------
# src/common/project_config.train_command() turns this section into Hydra overrides for third_party/parseq/train.py.
# Requires patches/parseq_train.patch (seed, augmentation strength, MLflow, swa switch, final.ckpt).
train:
  pretrained: parseq                         # start from baudm/parseq's scene-text weights
  seed: 42
  max_epochs: 15                             # fixed length, no early stopping; the LAST epoch is the model
  batch_size: 32
  lr: 1.5e-3                                 # PARSeq default 7e-4
  dropout: 0.2                               # PARSeq default 0.1
  weight_decay: 0.0
  warmup_pct: 0.075
  perm_num: 6                                # permutations per sample (permutation language modelling)
  img_size: [32, 128]                        # [height, width]; every crop is stretched to this
  max_label_length: 25
  charset: 94_full                           # the 94 printable ASCII characters PARSeq was pretrained with
  augment_magnitude: 9                       # RandAugment strength (PARSeq default 5)
  augment_num_layers: 3
  gradient_clip_val: 20
  swa: false                                 # no stochastic weight averaging
  num_workers: 0
  system_metrics_interval: 5                 # seconds between CPU/RAM/GPU samples logged to MLflow; null disables
  mlflow_experiment: parseq
