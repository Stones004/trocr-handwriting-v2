# @package _global_
# Fixed-length recipe used for the FINAL model: same hyperparameters as parseq_handwriting.yaml, but a fixed number
# of epochs (the LR schedule anneals to zero at the last epoch), no early stopping, no SWA, and the last-epoch
# model is the one used. Chosen from document-level CV: best epochs across 5 splits had median 12 (range 8-30).
# Requires patches/parseq_train.patch (the `swa` switch).
defaults:
  - override /model: parseq
  - override /charset: 94_full      # the 94 printable characters PARSeq was pretrained with; the label grammar is not enforced during decoding

pretrained: parseq
seed: 42                            # random seed (python, numpy, torch, data loaders)
mlflow_experiment: parseq_final
mlflow_db: mlflow.db                # tracking store; the launcher/drivers override this with paths.mlflow_db from config.yaml
system_metrics_interval: 5
swa: false

data:
  root_dir: data/parseq_lmdb
  train_dir: handwriting            # must equal lmdb.dataset_name in config.yaml
  num_workers: 0
  augment_magnitude: 9
  augment_num_layers: 3

# The values below are PARSeq's own defaults, pinned here so a re-cloned upstream repo cannot silently change a run.
model:
  img_size: [32, 128]               # [height, width]; every crop is resized to this
  max_label_length: 25              # longest label the model can emit
  batch_size: 32
  lr: 1.5e-3
  dropout: 0.2
  weight_decay: 0.0
  warmup_pct: 0.075
  perm_num: 6

trainer:
  accelerator: gpu
  devices: 1
  val_check_interval: 1.0
  max_epochs: 15
  gradient_clip_val: 20
