# Models compared by the validation pipeline (src/parseq/validate_models.py,
# src/common/summarize_validation.py). Add a model here to include it in the next validation run.
parseq:
  parseq_pretrained_zero_shot: pretrained          # reference: not fine-tuned, so no train/test gap by construction
  # Checkpoints A-F were deleted on 2026-09-24 (outputs/parseq and outputs/sweeps removed). Their per-sample results and the
  # comparison they produced are preserved in reports/validation/ and reports/model_validation.md; entries are kept commented out
  # as a record of what was compared. Uncomment only if the checkpoints are regenerated.
  # A_run_10-25-10_ep34: outputs/parseq/2026-09-21_10-25-10/checkpoints/epoch=34-*
  # B_run_11-07-04_ep13: outputs/parseq/2026-09-21_11-07-04/checkpoints/epoch=13-*
  # C_run_11-32-30_ep19: outputs/parseq/2026-09-21_11-32-30/checkpoints/epoch=19-*
  # D_sweep_std_trial14: outputs/sweeps/parseq_hparams_trial_014/checkpoints/epoch=14-*
  # E_sweep_std_trial0: outputs/sweeps/parseq_hparams_trial_000/checkpoints/epoch=14-*
  # F_sweep_aggr_trial0_ep7: outputs/sweeps/parseq_hparams_aggressive_trial_000/checkpoints/epoch=7-*
