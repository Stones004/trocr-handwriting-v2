# Hyperparameter search settings for src/parseq/sweep.py (Optuna TPE, one training run per trial).
# Search ranges live here, not in code. Trial 0 is always the current recipe: its values are read from the experiment
# yaml (`recipe` below) through each parameter's `override` key, so the baseline can never drift from the recipe.
# A parameter may set `baseline:` to use a different trial-0 value (weight_decay: the recipe's 0.0 cannot be
# expressed on a log-scale range, so 1e-5 stands in for it).
#
# Parameter types:  float {low, high, log}   int {low, high}   categorical {choices}
# `override` is the Hydra key the sampled value is written to (and the path in the recipe yaml used for the baseline).

recipe: parseq_handwriting          # experiment yaml under configs/parseq/experiment/ used for every trial

defaults:                           # command-line flags of sweep.py override these
  n_trials: 15
  max_epochs: 30
  patience: 5                       # early-stopping patience per trial (epochs)
  seed: 42                          # seed of the Optuna sampler
  min_free_gb: 2.5                  # stop before a trial if the system drive has less free space than this

spaces:
  standard:
    study: parseq_hparams
    mlflow_experiment: parseq_sweep
    params:
      lr:                 {type: float, low: 2.0e-4, high: 3.0e-3, log: true, override: model.lr}
      dropout:            {type: float, low: 0.05, high: 0.4, override: model.dropout}
      batch_size:         {type: categorical, choices: [16, 32, 64], override: model.batch_size}
      augment_magnitude:  {type: int, low: 3, high: 12, override: data.augment_magnitude}
      weight_decay:       {type: float, low: 1.0e-5, high: 0.1, log: true, override: model.weight_decay, baseline: 1.0e-5}
      warmup_pct:         {type: float, low: 0.05, high: 0.2, override: model.warmup_pct}

  # ~10x wider ranges plus extra knobs
  aggressive:
    study: parseq_hparams_aggressive
    mlflow_experiment: parseq_sweep_aggressive
    params:
      lr:                 {type: float, low: 1.0e-4, high: 1.0e-2, log: true, override: model.lr}
      dropout:            {type: float, low: 0.0, high: 0.7, override: model.dropout}
      batch_size:         {type: categorical, choices: [16, 32, 64, 128], override: model.batch_size}
      augment_magnitude:  {type: int, low: 1, high: 15, override: data.augment_magnitude}
      augment_num_layers: {type: int, low: 1, high: 6, override: data.augment_num_layers}
      weight_decay:       {type: float, low: 1.0e-6, high: 0.5, log: true, override: model.weight_decay, baseline: 1.0e-5}
      warmup_pct:         {type: float, low: 0.01, high: 0.4, override: model.warmup_pct}
      perm_num:           {type: categorical, choices: [2, 4, 6, 12], override: model.perm_num}
      grad_clip:          {type: categorical, choices: [1.0, 5.0, 20.0, 50.0], override: trainer.gradient_clip_val}
